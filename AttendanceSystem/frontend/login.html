<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJCET ERP - Login</title>
    <meta name="description" content="JJCET ERP - Secure login portal for Admin and Teachers.">
    
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

    
    <div id="alert-container" class="alert-container"></div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                
                <div class="logo-wrapper">
                    <img src="assets/images/jjcet-logo.png" alt="JJCET ERP Logo" class="login-logo" />
                </div>
                <h2>JJCET ERP</h2>
                <p>Enterprise Attendance Management</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="userId">User ID or Email Address</label>
                    <input type="text" id="userId" name="userId" class="form-control" required
                        autocomplete="username" placeholder="Enter your user ID or email address" aria-label="Enter your user ID or email address">
                </div>

                <div class="form-group password-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="form-control" required
                            autocomplete="current-password" placeholder="Enter your secure password" aria-label="Enter your secure password">
                        <button type="button" id="toggle-password" class="btn-icon" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="eye-icon">
                                <path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
                                <path fill-rule="evenodd" d="M.664 10.59a1.651 1.651 0 0 1 0-1.186A10.004 10.004 0 0 1 10 3c4.257 0 7.893 2.66 9.336 6.41.147.381.146.804 0 1.186A10.004 10.004 0 0 1 10 17c-4.257 0-7.893-2.66-9.336-6.41ZM14 10a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me" aria-label="remember me">
                        <span>Remember Me</span>
                    </label>
                </div>

                <button type="submit" class="btn mt-2" id="login-btn" aria-label="login btn">
                    <span class="btn-text">Secure Login</span>
                    <span class="spinner hidden"></span>
                </button>


            </form>
        </div>

        
        <div class="login-footer">
            Powered By Placement & Training Cell<br>
            J.J. College of Engineering and Technology (Autonomous)
        </div>
    </div>

    
    <script type="module" src="js/alerts.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>

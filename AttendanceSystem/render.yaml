services:
  - type: web
    name: jjcet-attendance-erp
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/AttendanceSystem-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEFAULT_ADMIN_ID
        value: ADMIN001
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_ADMIN_NAME
        value: System Administrator
      - key: DEFAULT_ADMIN_EMAIL
        value: administrator@jjcet.ac.in
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://jj-attendance-system.web.app

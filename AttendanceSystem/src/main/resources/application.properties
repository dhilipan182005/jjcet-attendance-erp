spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.main.lazy-initialization=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=file:frontend/,classpath:/static/
server.port=${PORT:10000}
institution.college-code=${INSTITUTION_COLLEGE_CODE:8113}
institution.engineering-course-duration-years=${INSTITUTION_COURSE_DURATION_YEARS:4}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.cache.type=simple
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.exposure.include=health
default-admin-id=${DEFAULT_ADMIN_ID:ADMIN001}
default-admin-password=${DEFAULT_ADMIN_PASSWORD:Jjcet@PlacementCell}
default-admin-name=${DEFAULT_ADMIN_NAME:System Administrator}
default-admin-email=${DEFAULT_ADMIN_EMAIL:administrator@jjcet.ac.in}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://jj-attendance-system.web.app,https://jjcet-attendance-erp-4sb7.onrender.com}
